[project]
authors = [{name = "Taka", email = "amano.takahisa@gmail.com"}]
dependencies = []
name = "napari-flicker"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
napari_flicker = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.feature.development.dependencies]
copier = ">=9.8.0,<10"
jinja2-time = ">=0.2.0,<0.3"
npe2 = ">=0.7.8,<0.8"
pre-commit = ">=4.2.0,<5"

[tool.pixi.feature.test.dependencies]
tox = ">=4.27.0,<5"
pytest = ">=8.4.1,<9"
pytest-cov = ">=6.2.1,<7"
pytest-qt = ">=4.5.0,<5"
napari = ">=0.6.2,<0.7"

[tool.pixi.environments]
test = ["test"]
development = ["development", "test"]

[dependency-groups]
test = ["pyqt5>=5.15.11,<6"]
