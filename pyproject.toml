[project]
authors = [{name = "Taka", email = "amano.takahisa@gmail.com"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []
description = "Blinking layers in napari"
dynamic = ["version"]
license = "LicenseRef-Hippocratic-3.0-bds-cl"
license-files = ["LICENSE"]
name = "napari-flicker"
readme = "README.md"
requires-python = ">=3.11"

[project.entry-points."napari.manifest"]
napari-flicker = "napari_flicker:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/amano-takahisa/napari-flicker/issues"
"Documentation" = "https://github.com/amano-takahisa/napari-flicker#README.md"
"Source Code" = "https://github.com/amano-takahisa/napari-flicker"
"User Support" = "https://github.com/amano-takahisa/napari-flicker/issues"

[build-system]
requires = ["setuptools>=77.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/napari_flicker/_version.py"
fallback_version = "0.0.1+nogit"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# Keep the lock file independent of the git-derived version. Otherwise the
# editable package version changes on every commit, making `pixi install
# --locked` (used by setup-pixi in CI) fail with "lock-file not up-to-date".
[tool.pixi.activation.env]
SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NAPARI_FLICKER = "0.0.0"

# VisPy's ctypes lookup does not find Conda's OpenGL library on NixOS.
[tool.pixi.target.linux-64.activation.env]
VISPY_GL_LIB = "$CONDA_PREFIX/lib/libGL.so.1"

[tool.pixi.target.linux-64.dependencies]
libgl = ">=1.7.0,<2"

[tool.pixi.pypi-dependencies]
napari_flicker = { path = ".", editable = true }

[tool.pixi.tasks]
test-all = "pixi run -e py311 test && pixi run -e py312 test && pixi run -e py313 test && pixi run -e py314 test"
test = "pytest -v --color=yes --cov=napari_flicker --cov-report=xml"

# Run Qt under Xvfb (started by pytest-xvfb) and ignore host Qt plugins (e.g.
# KDE's Qt 6 plugins) on Linux, where they can clash with the PyQt6 bundled in
# the environment. xcb_egl lets Qt render through Mesa EGL instead of GLX.
[tool.pixi.target.linux-64.tasks]
test = { cmd = "pytest -v --color=yes --cov=napari_flicker --cov-report=xml", env = { LIBGL_ALWAYS_SOFTWARE = "1", QT_PLUGIN_PATH = "", QT_QPA_PLATFORM = "xcb", QT_XCB_GL_INTEGRATION = "xcb_egl" } }

[tool.pixi.feature.development.dependencies]
copier = ">=9.8.0,<10"
jinja2-time = ">=0.2.0,<0.3"
pre-commit = ">=4.2.0,<5"
napari = "*"

[tool.pixi.feature.test.dependencies]
# Keep Qt and its native libraries together in the conda-forge environment.
pyqt6 = ">=6.5,<7,!=6.6.1,!=6.11.0,!=6.11.1"
napari = ">=0.9.2,<0.10"
pytest = ">=8.4.1,<9"
pytest-cov = ">=6.2.1,<7"
pytest-qt = ">=4.5.0,<5"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# napari 0.9 renders layers through QOpenGLWidget, which the Qt offscreen
# platform does not support. pytest-xvfb starts Xvfb so the tests get a real
# X display and an OpenGL context.
[tool.pixi.feature.test.target.linux-64.dependencies]
# xorg-xvfb-server ships share/X11/xkb/compiled/.keep, while xkeyboard-config
# >=2.45 makes share/X11/xkb a symlink. The two layouts cannot be linked into
# the same prefix, so pin the last version that installs a real directory.
xkeyboard-config = "2.44.*"
pytest-xvfb = ">=3.1.0,<4"
xorg-xvfb-server = ">=21.1.25,<22"

[tool.pixi.environments]
test = ["test", "py313"]
py311 = ["test", "py311"]
py312 = ["test", "py312"]
py313 = ["test", "py313"]
py314 = ["test", "py314"]
development = ["development", "test", "py313"]

[tool.ruff]
line-length = 79
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]
[tool.ruff.lint]
flake8-quotes.inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "S101",  # Use of assert detected
    "SLF001",  # Private member accessed: {access}
]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.isort]
line_length = 79

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
reportMissingImports = true
reportMissingTypeStubs = false
# Reduce napari-related warnings for external library compatibility
reportAttributeAccessIssue = "information"
reportOptionalMemberAccess = "warning"
reportReturnType = "warning"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
pythonVersion = "3.11"
typeCheckingMode = "basic"
ignore = [
    "src/napari_segmarg/statistics.py"
]
executionEnvironments = [{root = "src"}]
venvPath = ".pixi/envs/"
venv = "development"
