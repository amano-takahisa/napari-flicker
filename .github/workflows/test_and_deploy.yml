# This workflow uploads the package to PyPI with Trusted Publishing (OIDC)
# when a v* tag is pushed. No API token secret is required.
# See https://docs.pypi.org/trusted-publishers/
name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.lock'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.environment }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            environment: py310
          - platform: ubuntu-latest
            environment: py311
          - platform: ubuntu-latest
            environment: py312
          - platform: ubuntu-latest
            environment: py313
          - platform: windows-latest
            environment: py310
          - platform: windows-latest
            environment: py311
          - platform: windows-latest
            environment: py312
          - platform: windows-latest
            environment: py313
          # macos-latest is an Apple Silicon (osx-arm64) runner
          - platform: macos-latest
            environment: py313

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.49.0
          cache: true
          environments: ${{ matrix.environment }}

      # these libraries enable testing on Qt on linux
      - uses: tlambert03/setup-qt-libs@v1

      # strategy borrowed from vispy for installing opengl libs on windows
      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      # run tests with pixi for each Python version
      - name: Test with pixi
        uses: aganders3/headless-gui@v2
        with:
          run: pixi run --environment ${{ matrix.environment }} test

      - name: Coverage
        uses: codecov/codecov-action@v3

  deploy:
    # Runs when a commit tagged "v*" is pushed. Authentication uses the
    # GitHub OIDC token, matched by the PyPI Trusted Publisher configured for
    # this repository, workflow filename, and environment name.
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/napari-flicker
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git tags.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
