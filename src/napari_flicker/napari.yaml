name: napari-flicker
display_name: Flicker
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-flicker.get_reader
      python_name: napari_flicker._reader:napari_get_reader
      title: Open data with Flicker
    - id: napari-flicker.write_multiple
      python_name: napari_flicker._writer:write_multiple
      title: Save multi-layer data with Flicker
    - id: napari-flicker.write_single_image
      python_name: napari_flicker._writer:write_single_image
      title: Save image data with Flicker
    - id: napari-flicker.make_sample_data
      python_name: napari_flicker._sample_data:make_sample_data
      title: Load sample data from Flicker
    - id: napari-flicker.make_qwidget
      python_name: napari_flicker:ExampleQWidget
      title: Make example QWidget
  readers:
    - command: napari-flicker.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: napari-flicker.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-flicker.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  sample_data:
    - command: napari-flicker.make_sample_data
      display_name: Flicker
      key: unique_id.1
  widgets:
    - command: napari-flicker.make_qwidget
      display_name: Example QWidget
